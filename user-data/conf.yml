# yaml-language-server: $schema=https://raw.githubusercontent.com/Lissy93/dashy/master/src/utils/config/ConfigSchema.json
---
# Page meta info, like heading, footer text and nav links
pageInfo:
  title: i007.vip
  description: Home Lab
  navLinks:
    - title: Home
      path: /

# Optional app settings and configuration
appConfig:
  theme: fallout
  layout: horizontal
  iconSize: large
  startingView: default
  defaultOpeningMethod: newtab
  statusCheck: false
  statusCheckInterval: 0
  faviconApi: allesedv
  enableMultiTasking: false
  widgetsAlwaysUseProxy: false
  webSearch:
    disableWebSearch: false
    searchEngine: duckduckgo
    openingMethod: newtab
    searchBangs: {}
  enableFontAwesome: false
  enableMaterialDesignIcons: false
  hideComponents:
    hideHeading: false
    hideNav: false
    hideSearch: true
    hideSettings: false
    hideFooter: false
  auth:
    enableGuestAccess: true
    enableHeaderAuth: false
    headerAuth:
      userHeader: REMOTE_USER
      proxyWhitelist: []
    enableKeycloak: false
  showSplashScreen: false
  preventWriteToDisk: false
  preventLocalSave: false
  disableConfiguration: false
  disableConfigurationForNonAdmin: true
  allowConfigEdit: true
  enableServiceWorker: true
  disableContextMenu: true
  disableUpdateChecks: false
  disableSmartSort: false
  enableErrorReporting: false
  colCount: 4
  language: en

